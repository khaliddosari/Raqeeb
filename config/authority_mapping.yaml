# Maps a YOLO detection class to the authority that must be notified.
#
# This file is the single source of truth for CLASS -> AUTHORITY -> PHONE -> ENDPOINT
# routing. Add/edit entries here to change routing behavior without touching code.
#
# Fields per authority entry:
#   name             human-readable authority name
#   phone_number     E.164 phone number Twilio will call
#   report_endpoint  URL the structured report is POSTed to (webhook/API/email-bridge)
#   endpoint_type    "webhook" | "email" | "api"  (informational, used by report sender)
#   default_severity default severity to suggest for this class ("low" | "medium" | "high" | "critical")

classes:
  Gun:
    name: "Airport Police - Armed Response Unit"
    phone_number: "${AUTHORITY_GUN_PHONE:-+966554626773}"
    report_endpoint: "${AUTHORITY_GUN_ENDPOINT:-https://example-authority.local/api/incidents}"
    endpoint_type: "webhook"
    default_severity: "critical"

  Knife:
    name: "Airport Security - Rapid Response"
    phone_number: "${AUTHORITY_KNIFE_PHONE:-+966554626773}"
    report_endpoint: "${AUTHORITY_KNIFE_ENDPOINT:-https://example-authority.local/api/incidents}"
    endpoint_type: "webhook"
    default_severity: "high"

  Pliers:
    name: "Airport Security - Standard Response"
    phone_number: "${AUTHORITY_PLIERS_PHONE:-+966554626773}"
    report_endpoint: "${AUTHORITY_PLIERS_ENDPOINT:-https://example-authority.local/api/incidents}"
    endpoint_type: "webhook"
    default_severity: "medium"

  Scissors:
    name: "Airport Security - Standard Response"
    phone_number: "${AUTHORITY_SCISSORS_PHONE:-+966554626773}"
    report_endpoint: "${AUTHORITY_SCISSORS_ENDPOINT:-https://example-authority.local/api/incidents}"
    endpoint_type: "webhook"
    default_severity: "low"

  Wrench:
    name: "Airport Security - Standard Response"
    phone_number: "${AUTHORITY_WRENCH_PHONE:-+966554626773}"
    report_endpoint: "${AUTHORITY_WRENCH_ENDPOINT:-https://example-authority.local/api/incidents}"
    endpoint_type: "webhook"
    default_severity: "low"

# Fallback used when a detected class has no explicit mapping above.
default:
  name: "Airport Security - General Desk"
  phone_number: "${AUTHORITY_DEFAULT_PHONE:-+966554626773}"
  report_endpoint: "${AUTHORITY_DEFAULT_ENDPOINT:-https://example-authority.local/api/incidents}"
  endpoint_type: "webhook"
  default_severity: "medium"
