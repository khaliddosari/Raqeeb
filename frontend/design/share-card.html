<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Raqeeb share images</title>
    <!--
      Source for the link preview (public/og-image.jpg, 1200x675) and the iOS home screen icon
      (public/apple-touch-icon.png, 180x180). Not part of the app build. After editing, regenerate
      both from the repo root with:

        uv run --with playwright --with pillow python frontend/design/render_share_images.py
    -->
    <style>
      @font-face {
        font-family: "Thmanyah Sans";
        src: url("https://cdn.jsdelivr.net/gh/khaliddosari/thmanyah-fonts@v1/thmanyah%20typeface/thmanyahsans/woff2/thmanyahsans-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Thmanyah Sans";
        src: url("https://cdn.jsdelivr.net/gh/khaliddosari/thmanyah-fonts@v1/thmanyah%20typeface/thmanyahsans/woff2/thmanyahsans-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Thmanyah Serif Display";
        src: url("https://cdn.jsdelivr.net/gh/khaliddosari/thmanyah-fonts@v1/thmanyah%20typeface/thmanyahserifdisplay/woff2/thmanyahserifdisplay-Black.woff2") format("woff2");
        font-weight: 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: #0b0f1a;
        display: flex;
        gap: 40px;
        align-items: flex-start;
      }

      /* ---- 1200x675 link preview ------------------------------------------------------ */
      #card {
        position: relative;
        width: 1200px;
        height: 675px;
        overflow: hidden;
        padding: 68px 76px 64px;
        display: flex;
        flex-direction: column;
        color: #ffffff;
        font-family: "Thmanyah Sans", sans-serif;
        background:
          radial-gradient(760px 520px at 88% 18%, rgba(88, 140, 255, 0.3), transparent 62%),
          radial-gradient(680px 460px at 4% 112%, rgba(46, 98, 214, 0.34), transparent 60%),
          linear-gradient(135deg, #06132c 0%, #0d2a61 56%, #091c42 100%);
      }
      /* a faint screening grid, fading out towards the text */
      #card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(620px 520px at 82% 42%, #000 0%, transparent 72%);
        mask-image: radial-gradient(620px 520px at 82% 42%, #000 0%, transparent 72%);
      }
      /* content above the grid; the watermark and scan line stay absolutely placed behind it */
      #card > :not(.watermark):not(.scanline) {
        position: relative;
      }

      .watermark {
        position: absolute;
        right: -70px;
        top: 70px;
        width: 520px;
        height: 520px;
        opacity: 0.1;
      }
      .scanline {
        position: absolute;
        right: 0;
        top: 318px;
        width: 560px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(169, 193, 255, 0.55), transparent);
        box-shadow: 0 0 24px 6px rgba(120, 160, 255, 0.18);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .brand svg {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.35));
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 24px;
        font-family: "Thmanyah Serif Display", serif;
        font-weight: 900;
        font-size: 84px;
        line-height: 1;
      }
      .wordmark .ar {
        color: #a9c1ff;
      }
      .wordmark .divider {
        width: 2px;
        height: 64px;
        background: rgba(255, 255, 255, 0.28);
      }

      /* auto margins above the headline and the footer share the free height evenly */
      .headline {
        margin-top: auto;
        padding-top: 20px;
        max-width: 980px;
        font-weight: 700;
        font-size: 54px;
        line-height: 1.14;
        letter-spacing: -0.5px;
      }
      .subline {
        margin-top: 20px;
        display: inline-block;
        align-self: flex-start;
        font-weight: 500;
        font-size: 31px;
        line-height: 1.4;
        color: #c8d5f6;
      }

      .footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .chips {
        display: flex;
        gap: 14px;
      }
      .chip {
        padding: 10px 22px 12px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 255, 255, 0.24);
        background: rgba(255, 255, 255, 0.07);
        font-weight: 500;
        font-size: 23px;
        color: #e6ecfb;
        white-space: nowrap;
      }
      .domain {
        font-weight: 500;
        font-size: 24px;
        color: #a9c1ff;
        white-space: nowrap;
      }

      /* ---- 180x180 iOS home screen icon (iOS rounds the corners itself) ---------------- */
      #icon {
        width: 180px;
        height: 180px;
        display: grid;
        place-items: center;
        background: radial-gradient(160px 160px at 70% 20%, #1f4ea8, transparent 70%), linear-gradient(135deg, #07152f, #0d2a61);
      }
      #icon svg {
        width: 124px;
        height: 124px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <!-- the logo, large and faint, with a scan line crossing it -->
      <svg class="watermark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.75 26.5 6.6v8.15c0 6.55-4.35 11.9-10.5 14.5-6.15-2.6-10.5-7.95-10.5-14.5V6.6z" fill="none" stroke="#fff" stroke-width="0.5" />
        <path d="M8.75 16c1.9-3.1 4.3-4.65 7.25-4.65S21.35 12.9 23.25 16c-1.9 3.1-4.3 4.65-7.25 4.65S10.65 19.1 8.75 16z" fill="none" stroke="#fff" stroke-width="0.5" />
        <circle cx="16" cy="16" r="2.3" fill="#fff" />
      </svg>
      <div class="scanline"></div>

      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.75 26.5 6.6v8.15c0 6.55-4.35 11.9-10.5 14.5-6.15-2.6-10.5-7.95-10.5-14.5V6.6z" fill="#f5f8ff" />
          <path d="M8.75 16c1.9-3.1 4.3-4.65 7.25-4.65S21.35 12.9 23.25 16c-1.9 3.1-4.3 4.65-7.25 4.65S10.65 19.1 8.75 16z" fill="none" stroke="#0d2a61" stroke-width="1.7" stroke-linejoin="round" />
          <circle cx="16" cy="16" r="2.3" fill="#0d2a61" />
        </svg>
        <div class="wordmark">
          <span>Raqeeb</span>
          <span class="divider"></span>
          <span class="ar" lang="ar">رقيب</span>
        </div>
      </div>

      <h1 class="headline">AI screening that detects threats and alerts the right authority</h1>
      <p class="subline" lang="ar" dir="rtl">يرصد المواد المحظورة في صور الأشعة السينية ويبلّغ الجهة المختصة فورًا</p>

      <div class="footer">
        <div class="chips">
          <span class="chip">X-ray threat detection</span>
          <span class="chip">Arabic voice dispatch</span>
          <span class="chip">Live incident reports</span>
        </div>
        <span class="domain">raqeeb.khalid-ai.dev</span>
      </div>
    </div>

    <div id="icon">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.75 26.5 6.6v8.15c0 6.55-4.35 11.9-10.5 14.5-6.15-2.6-10.5-7.95-10.5-14.5V6.6z" fill="#f5f8ff" />
        <path d="M8.75 16c1.9-3.1 4.3-4.65 7.25-4.65S21.35 12.9 23.25 16c-1.9 3.1-4.3 4.65-7.25 4.65S10.65 19.1 8.75 16z" fill="none" stroke="#0d2a61" stroke-width="1.7" stroke-linejoin="round" />
        <circle cx="16" cy="16" r="2.3" fill="#0d2a61" />
      </svg>
    </div>
  </body>
</html>
